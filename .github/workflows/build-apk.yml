name: Build IMS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.86.5
          pip install flet-cli==0.86.5

      - name: Build APK
        run: |
          flet build apk --permissions camera --yes

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IMS-Android-APK
          path: build/**/*.apk
          if-no-files-found: error
